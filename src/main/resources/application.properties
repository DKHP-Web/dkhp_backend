spring.application.name=dkhp_backend

# MySQL DB Config
spring.datasource.url=jdbc:mysql://localhost:3307/dkhpdb
spring.datasource.username=root
spring.datasource.password=MyNewPass123!
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=schema.sql
spring.jpa.properties.javax.persistence.schema-generation.create-source=metadata
spring.jpa.show-sql=true
